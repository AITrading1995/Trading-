<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal - Trade Log</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Trading Journal</h1>
        <nav>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="trade-log.html">Trade Log</a></li>
                <li><a href="statistics.html">Statistics</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="trade-log-form">
            <h2>Log a New Trade</h2>
            <form id="trade-form">
                <div class="form-group">
                    <label for="initial-balance">Initial Balance:</label>
                    <input type="number" id="initial-balance" required>
                </div>
                <div class="form-group">
                    <label for="date">Date:</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="symbol">Symbol:</label>
                    <input type="text" id="symbol" required>
                </div>
                <div class="form-group">
                    <label for="action">Action:</label>
                    <select id="action" required>
                        <option value="buy">Buy</option>
                        <option value="sell">Sell</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="entry">Entry Price:</label>
                    <input type="number" id="entry" step="any" required>
                </div>
                <div class="form-group">
                    <label for="tp">Take Profit (TP):</label>
                    <input type="number"id="tp" step="any" required>
                </div>
                <div class="form-group">
                    <label for="sl">Stop Loss (SL):</label>
                    <input type="number" id="sl" step="any" required>
                </div>
                <div class="form-group">
                    <label for="status">Status:</label>
                    <select id="status" required>
                        <option value="hold">Hold</option>
                        <option value="exit">Exit</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="exit-price">Exit Price:</label>
                    <input type="number" id="exit-price" step="any">
                </div>
                <button type="submit">Log Trade</button>
            </form>
        </section>
        <section class="trade-history">
            <h2>Trade History</h2>
            <table id="trade-history-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Symbol</th>
                        <th>Action</th>
                        <th>Entry</th>
                        <th>TP</th>
                        <th>SL</th>
                        <th>Status</th>
                        <th>Exit Price</th>
                        <th>Profit/Loss</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Trade history will be populated here by JavaScript -->
                </tbody>
            </table>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
