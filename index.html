<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Trading Journal</h1>
        <nav>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="trade-log.html">Trade Log</a></li>
                <li><a href="statistics.html">Statistics</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="dashboard-summary">
            <h2>Dashboard</h2>
            <div class="chart-container">
                <h3>Equity Curve</h3>
                <canvas id="equity-curve-chart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Drawdown</h3>
                <canvas id="drawdown-chart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Profit vs. Moving Average</h3>
                <canvas id="profit-ma-scatter-plot"></canvas>
            </div>
            <div class="chart-container">
                <h3>Daily Profit/Loss</h3>
                <canvas id="daily-pl-bar-chart"></canvas>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
